[[mgr.prepend_keymap]]
on = "<C-p>"
run = 'shell --orphan -- "/home/tiejun/.config/yazi-nvim/open-selected-media.sh" "%h" %s'
desc = "Open selected images in sxiv / PDFs in zathura"

[[mgr.prepend_keymap]]
on   = [ "C" ]
run  = "plugin ouch"
desc = "Compress selection with ouch"

[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"
