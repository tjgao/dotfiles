[manager]
ratio = [1, 2, 4]
linemode = "size_and_mtime"

[preview]
max_width = 2000
max_height = 2000
image_quality = 80

[opener]
play = [
    { run = 'mpv --force-window %s', orphan = true, for = "unix" },
]

pdf_viewer = [
    { run = 'zathura %s', orphan = true, for = "unix" },
]

# image_viewer = [
#     { run = '~/.local/bin/gsxiv.py "$@"', orphan = true, for = "unix" },
# ]

image_external = [
  { run = "sxiv %s", orphan = true, block = false, for = "linux" }
]

# image_external = [
#   { run = "nohup sxiv \"%s\" >/dev/null 2>&1 &", orphan = true, block = false, for = "linux" }
# ]


edit = [
    { run = '$EDITOR %s', block = true, for = "unix" },
]

[open]
prepend_rules = [
    { mime = "image/*", use = [ "image_external" ] },
    { mime = "application/{pdf,epub}", use = "pdf_viewer" },
    { url = "*.js", use = "edit" },
    { url = "*.html", use = ["edit", "open", "reveal"] },
    { mime = "image/*", use = [ "image_viewer", "reveal" ] },
    { mime = "{audio,video}/*", use = [ "play", "reveal" ] },
]

[plugin]
prepend_previewers = [
    { url = "*.csv", run = "duckdb" },
    { url = "*.tsv", run = "duckdb" },
    { url = "*.parquet", run = "duckdb" },
    { url = "*.json", run = "duckdb" },
    { url = "*.duckdb", run = "duckdb" },
    { url = "*.db", run = "duckdb" },
    { mime = "application/x-tar", run = "ouch" },
    { mime = "application/x-bzip2", run = "ouch" },
    { mime = "application/gzip", run = "ouch" },
    { mime = "application/zip", run = "ouch" },
    { mime = "application/x-7z-compressed", run = "ouch" },
    { mime = "application/x-rar", run = "ouch" },
    { url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
    { mime = "{image,audio,video}/*", run = "mediainfo" },
    { mime = "application/x-subrip", run = "mediainfo" },
]

prepend_preloaders = [
    { url = "*.csv", run = "duckdb", multi = false },
    { url = "*.tsv", run = "duckdb", multi = false },
    { url = "*.json", run = "duckdb", multi = false },
    { url = "*.parquet", run = "duckdb", multi = false },
    { url = "*.avro", run = "duckdb", multi = false },
    { url = "*.txt", run = "duckdb", multi = false },
    { url = "*.xlsx", run = "duckdb", multi = false },
]
