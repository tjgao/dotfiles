[[mgr.prepend_keymap]]
on = "q"
run = "plugin confirm-quit"
desc = "Quit yazi with confirmation"

[[mgr.prepend_keymap]]
on = "<C-p>"
run = 'shell --orphan -- "/home/tiejun/.config/yazi-wsl/open-selected-media.sh" "%h" %s'
desc = "Open selected images in sxiv / PDFs in zathura"

[[mgr.prepend_keymap]]
on = "Z"
run = 'shell --block -- ya emit cd "$(zoxide query -i)"'
desc = "Jump to a directory via zoxide"

[[mgr.prepend_keymap]]
on = "z"
run = "shell --block -- fzf -m"
desc = "Jump to a file via zoxide"

[[mgr.prepend_keymap]]
on = "C"
run = "plugin ouch"
desc = "Compress with ouch"

[[mgr.prepend_keymap]]
on = "T"
run = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"
